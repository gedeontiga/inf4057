apiVersion: v1
kind: Namespace
metadata:
  name: microservices
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-config
  namespace: microservices
spec:
  replicas: 1
  selector:
  matchLabels:
    app: service-config
  template:
    metadata:
      labels:
        app: service-config
    spec:
      containers:
        - name: service-config
          image: gedeontiga/inf4057-service-config:latest
          ports:
            - containerPort: 8888
          env:
            - name: SPRING_APPLICATION_NAME
              value: "service-config"
            - name: SPRING_CLOUD_CONFIG_SERVER_GIT_URI
              value: "https://github.com/gedeontiga/cloud-conf-inf4057"
---
apiVersion: v1
kind: Service
metadata:
  name: service-config
  namespace: microservices
spec:
  type: LoadBalancer
  ports:
    - port: 8888
      targetPort: 8888
  selector:
    app: service-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-registry
  template:
    metadata:
      labels:
        app: service-registry
    spec:
      containers:
        - name: service-registry
          image: gedeontiga/inf4057-service-registry:latest
          ports:
            - containerPort: 8761
          env:
            - name: SPRING_APPLICATION_NAME
              value: "service-registry"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://service-config:8888"
            - name: SPRING_CONFIG_IMPORT
              value: "configserver:http://service-config:8888"
---
apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: microservices
spec:
  type: LoadBalancer
  ports:
    - port: 8761
      targetPort: 8761
  selector:
    app: service-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-user
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-user
  template:
    metadata:
      labels:
        app: service-user
    spec:
      containers:
        - name: service-user
          image: gedeontiga/inf4057-service-user:latest
          ports:
            - containerPort: 8081
          env:
            - name: GATEWAY_SECRET
            - value: ${GATEWAY_SECRET}
            - name: SPRING_APPLICATION_NAME
              value: "service-user"
            - name: SPRING_CLOUD_CONFIG_URI
              value: "http://service-config:8888"
            - name: SPRING_CONFIG_IMPORT
              value: "configserver:http://service-config:8888"
---
apiVersion: v1
kind: Service
metadata:
  name: service-user
  namespace: microservices
spec:
  type: LoadBalancer
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: service-user
